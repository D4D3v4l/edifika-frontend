<div class="common-area-card">
  <div class="card-header">
    <div class="icon-box">
      <span class="material-icons">{{ areaIcon }}</span>
    </div>

    <div class="card-content">
      <h3>{{ commonArea.name }}</h3>

      <p class="badge">{{ areaBadge }}</p>
    </div>

    <div class="card-btn-container">
      <label class="switch">
        <input
          type="checkbox"
          [checked]="commonArea.status === 'AVAILABLE'"
          (change)="toggleStatus()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card-actions">
    <button class="btn-primary" (click)="openEditRules(commonArea)">Edit Rules</button>

    <button
      class="btn-icon"
      type="button"
      title="Ver reglas actuales"
      (click)="openHistory()">
      <span class="material-icons">history</span>
    </button>
  </div>
</div>
